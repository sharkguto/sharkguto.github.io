[project]
name = "gmf_tech"
version = "1.0.0"
description = "website gmf-tech"
authors = [{ name = "Gustavo M Freitas", email = "gustavo@gmf-tech.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "flet==0.86.5",
    "flet-webview==0.86.5",
    "pyecharts==2.1.0",
    "httpx==0.28.1; platform_system != 'Emscripten'",
    "typing_extensions==4.15.0",
]

[project.optional-dependencies]
serve = [
    "flet-web==0.86.5",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[tool.flet]
org = "com.gmf-tech"                          # --org
product = "GMF tech website"                  # --product
company = "GMF tech"                          # --company
copyright = "Copyright (C) 2026 by sharkguto" # --copyright
build_number = 1                              # --build-number

[tool.flet.app]
module = "app"
exclude = [
    ".coverage",
    ".coveragerc",
    ".gitignore",
    ".pytest_cache",
    ".venv",
    "AGENTS.md",
    "README.md",
    "__pycache__",
    "images",
    "new2.py",
    "old.py",
    "pages/__pycache__",
    "pyproject.toml",
    "pytest.ini",
    "requirements-dev.txt",
    "requirements.txt",
    "tests",
    "tools",
    "utils/__pycache__",
    "uv.lock",
]

[tool.flet.cleanup]
package_files = [
    "**/test",
    "**/testing",
    "**/tests",
]

[tool.flet.web]
base_url = "/"              # --base-url
renderer = "canvaskit"      # --web-renderer
use_color_emoji = false     # --use-color-emoji
route_url_strategy = "hash" # --route-url-strategy
